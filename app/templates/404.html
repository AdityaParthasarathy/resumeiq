{% extends "base.html" %}

{% block title %}ResumeIQ &mdash; Page not found{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-24 text-center">
    <p class="text-6xl font-bold text-indigo-200">404</p>
    <h1 class="mt-4 text-xl font-semibold text-slate-800">Page not found</h1>
    <p class="mt-2 text-sm text-slate-500">
        That resume or page doesn't exist &mdash; it may have expired, since uploads aren't kept permanently.
    </p>
    <a href="{{ url_for('main.index') }}"
       class="mt-6 inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
        Upload a resume
    </a>
</section>
{% endblock %}
