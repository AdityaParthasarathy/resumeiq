{% extends "base.html" %}

{% block title %}ResumeIQ &mdash; Something went wrong{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-24 text-center">
    <p class="text-6xl font-bold text-red-200">500</p>
    <h1 class="mt-4 text-xl font-semibold text-slate-800">Something went wrong</h1>
    <p class="mt-2 text-sm text-slate-500">
        An unexpected error occurred while processing that request. Please try again.
    </p>
    <a href="{{ url_for('main.index') }}"
       class="mt-6 inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
        Back to upload
    </a>
</section>
{% endblock %}
